name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (cargo pkgid) -replace '.*[#@]', ''
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $version" }
          $hash = (Get-FileHash target/release/ftp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ftp.exe" | Out-File -Encoding ascii target/release/ftp.exe.sha256
          gh release create $env:TAG target/release/ftp.exe target/release/ftp.exe.sha256 --generate-notes
